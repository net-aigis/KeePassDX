name: NetAigis KeySafe - Android build and tests

on:
  push:
    branches: ["main", "feature/**", "security/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify fork identity
        run: |
          grep -Fq 'applicationId = "de.netaigis.keysafe"' app/build.gradle.kts
          grep -Fq 'NetAigis KeySafe' app/src/main/res/values/donottranslate.xml
          grep -Fq 'android:authorities="${applicationId}.coordinator"' app/src/main/AndroidManifest.xml
      - name: Run Android unit tests and compile app
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            :app:testLibreDebugUnitTest :app:assembleLibreDebug
      - name: Preserve built APK for testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: netaigis-keysafe-libre-debug
          path: app/build/outputs/apk/libre/debug/*.apk
          if-no-files-found: error
